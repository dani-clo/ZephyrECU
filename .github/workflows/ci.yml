name: ZephyrECU CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows firmware build (${{ matrix.board }})
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: [s32k148_evb, arduino_uno_q]

    defaults:
      run:
        shell: bash

    env:
      BUILD_BOARD: ${{ matrix.board }}
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_SDK_INSTALL_DIR: C:/zephyr-sdk
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ZephyrECU

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          choco install gperf dtc-msys2 --yes --no-progress
          cmake --version
          ninja --version
          7z i

      - name: Install west
        run: python -m pip install west

      - name: Initialize Zephyr workspace
        run: |
          west init -l ZephyrECU
          west update --narrow -o=--depth=1
          west manifest --validate

      - name: Install Zephyr requirements
        run: |
          python -m pip install \
            -r zephyr/scripts/requirements-base.txt \
            -r ZephyrECU/tools/requirements-codegen.txt

      - name: Install ARM Zephyr SDK
        # west uses the version in zephyr/SDK_VERSION; download only ARM tools.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install \
            --install-dir C:/zephyr-sdk \
            --gnu-toolchains arm-zephyr-eabi \
            --personal-access-token "$GH_TOKEN"

      - name: Check DBC generation
        run: python ZephyrECU/tools/dbc_codegen.py --check

      - name: Build firmware
        run: |
          mkdir -p build/logs
          west build -b "$BUILD_BOARD" ZephyrECU -d "build/$BUILD_BOARD" \
            -- -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee build/logs/windows-build.log

      - name: Upload firmware and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.board }}
          include-hidden-files: true
          path: |
            build/${{ matrix.board }}/zephyr/zephyr.elf
            build/${{ matrix.board }}/zephyr/zephyr.bin
            build/${{ matrix.board }}/zephyr/zephyr.hex
            build/${{ matrix.board }}/zephyr/.config
            build/${{ matrix.board }}/zephyr/zephyr.dts
            build/${{ matrix.board }}/CMakeFiles/CMakeConfigureLog.yaml
            build/logs/windows-build.log
          if-no-files-found: warn

  native-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ZephyrECU

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare log directory
        run: mkdir -p build/logs

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build gperf \
            device-tree-compiler \
            build-essential gcc-multilib g++-multilib \
            iproute2 kmod can-utils

      - name: Install west
        run: python -m pip install west

      - name: Initialize Zephyr workspace
        run: |
          west init -l ZephyrECU
          west update --narrow -o=--depth=1
          west manifest --validate

      - name: Install Zephyr requirements
        run: |
          python -m pip install \
            -r zephyr/scripts/requirements-base.txt \
            -r zephyr/scripts/requirements-build-test.txt \
            -r zephyr/scripts/requirements-run-test.txt \
            -r ZephyrECU/tools/requirements-codegen.txt

      - name: Check DBC generation and codec
        run: |
          python ZephyrECU/tools/dbc_codegen.py --check
          python -m unittest discover -s ZephyrECU/tests/codegen -v \
            2>&1 | tee build/logs/codegen-tests.log

      - name: Run unit tests with coverage
        run: |
          python zephyr/scripts/twister \
            -T ZephyrECU/tests \
            -p native_sim \
            --coverage --coverage-tool gcovr \
            --coverage-formats html,txt \
            --coverage-basedir "$PWD/ZephyrECU" \
            --outdir build/twister-contracts \
            --inline-logs 2>&1 | tee build/logs/unit-tests.log

      - name: Generate component coverage reports
        run: |
          mkdir -p build/coverage-components
          gcovr --root "$PWD/ZephyrECU" \
            --add-tracefile build/twister-contracts/coverage.json \
            --filter "$PWD/ZephyrECU/components/" \
            --exclude '.*/generated/.*' --exclude '.*/tests/.*' \
            --merge-mode-functions=separate \
            --html-details build/coverage-components/index.html \
            --txt build/coverage-components/coverage.txt \
            --json-summary build/coverage-components/summary.json \
            --print-summary 2>&1 | tee build/logs/component-coverage.log
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("build/coverage-components")
          summary = json.loads((report / "summary.json").read_text())
          if summary["line_total"] == 0:
              raise SystemExit("Component coverage report contains no executable lines")
          percent = 100 * summary["line_covered"] / summary["line_total"]
          badge = {
              "schemaVersion": 1,
              "label": "coverage (components)",
              "message": f"{percent:.1f}%",
              "color": "brightgreen" if percent >= 90 else "yellow" if percent >= 75 else "red",
          }
          (report / "badge.json").write_text(json.dumps(badge) + "\n", encoding="utf-8")
          PY

      - name: Upload component coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-component-coverage
          path: build/coverage-components/
          if-no-files-found: warn

      - name: Setup virtual CAN
        run: |
          uname -r | tee build/logs/kernel.txt
          if ! sudo modprobe vcan; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          if ! ip link show dev vcan0 >/dev/null 2>&1; then
            sudo ip link add dev vcan0 type vcan
          fi
          sudo ip link set dev vcan0 up
          ip -details link show vcan0 | tee build/logs/vcan.txt
          python - <<'PY'
          import socket
          with socket.socket(socket.PF_CAN, socket.SOCK_RAW, socket.CAN_RAW) as raw:
              raw.bind(("vcan0",))
          print("SocketCAN available to the test user")
          PY

      - name: Check kernel ISO-TP support
        id: isotp
        run: |
          # Loading a module is optional: ISO-TP may be built into the kernel.
          # Only the socket probe below determines whether to run the tester.
          sudo modprobe can-isotp 2>&1 | tee build/logs/isotp-module.log || true
          python - <<'PY' 2>&1 | tee build/logs/isotp-probe.log
          import errno
          import os
          import socket
          from pathlib import Path

          try:
              tester = socket.socket(socket.PF_CAN, socket.SOCK_DGRAM, socket.CAN_ISOTP)
          except OSError as error:
              if error.errno not in (errno.EPROTONOSUPPORT, errno.EAFNOSUPPORT):
                  raise
              available = False
              message = f"UDS integration test skipped: kernel ISO-TP unavailable ({error})."
              print(f"::warning::{message}")
          else:
              # Binding errors indicate broken setup and must fail the job.
              with tester:
                  tester.bind(("vcan0", 0x7e8, 0x7e0))
              available = True
              message = "Kernel ISO-TP available; UDS integration test enabled."
              print(message)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"available={str(available).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"{message}\n\n")
              if not available:
                  summary.write("UDS build, all unit tests, raw CAN and can_comm integration and "
                                "application smoke test remain required.\n")
          PY

      - name: CAN integration test
        run: |
          west build -b native_sim \
            -S socketcan-native-sim \
            ZephyrECU/tests/can_if_socketcan \
            -d build/tests/can_if_socketcan \
            2>&1 | tee build/logs/can-build.log

          timeout 90s python ZephyrECU/tools/test_can_if_socketcan.py \
            build/tests/can_if_socketcan/zephyr/zephyr.exe \
            --interface vcan0 2>&1 | tee build/logs/can-integration.log

      - name: CAN communication integration test
        run: |
          west build -b native_sim \
            -S socketcan-native-sim \
            ZephyrECU/tests/can_comm_socketcan \
            -d build/tests/can_comm_socketcan \
            2>&1 | tee build/logs/can-comm-build.log
          timeout 60s python ZephyrECU/tools/test_can_comm_socketcan.py \
            build/tests/can_comm_socketcan/zephyr/zephyr.exe \
            --interface vcan0 2>&1 | tee build/logs/can-comm-integration.log

      - name: Build UDS integration exerciser
        run: |
          west build -b native_sim \
            -S socketcan-native-sim \
            ZephyrECU/tests/diag_uds_socketcan \
            -d build/tests/diag_uds_socketcan \
            2>&1 | tee build/logs/uds-build.log

      - name: UDS integration test
        if: steps.isotp.outputs.available == 'true'
        run: |
          # Shared runners are not real-time hosts. Protocol checks still fail
          # on errors; host timing is observed. ztest enforces pacing regression.
          timeout 120s python ZephyrECU/tools/test_uds_socketcan.py \
            build/tests/diag_uds_socketcan/zephyr/zephyr.exe \
            --interface vcan0 --timing report \
            2>&1 | tee build/logs/uds-integration.log

      - name: Application smoke test
        run: |
          west build -b native_sim \
            -S socketcan-native-sim \
            ZephyrECU \
            -d build/native_sim \
            2>&1 | tee build/logs/application-build.log

          # Returning from Zephyr main with an error need not fail the host process.
          timeout 15s \
            build/native_sim/zephyr/zephyr.exe \
            --can-if=vcan0 -rt -stop_at=1 \
            2>&1 | tee build/logs/application-smoke.log
          grep -Fq 'ZephyrECU CAN and diagnostics ready' build/logs/application-smoke.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-test-results
          path: |
            build/twister-contracts/
            build/logs/
          if-no-files-found: warn

  publish-coverage:
    name: Publish coverage report
    needs: [native-sim, windows-build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download component coverage reports
        uses: actions/download-artifact@v4
        with:
          name: native-sim-component-coverage
          path: coverage-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload coverage site
        uses: actions/upload-pages-artifact@v4
        with:
          path: coverage-site

      - name: Deploy coverage site
        id: deployment
        uses: actions/deploy-pages@v4
